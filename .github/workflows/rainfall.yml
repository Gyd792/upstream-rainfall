name: Rainfall collection (every 5 minutes)
on:
  schedule:
    # Offset away from the top of the hour to reduce GitHub schedule congestion.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - ".github/workflows/rainfall.yml"
permissions:
  contents: write
concurrency:
  group: rainfall-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect observed precipitation (three attempts per city)
        run: |
          for attempt in 1 2 3; do
            if python scripts/collect.py; then
              echo "Collection completed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Collection failed; retrying in 30 seconds ($attempt/3)."
              sleep 30
            fi
          done
          echo "::error::Collection failed after 3 workflow attempts."
          exit 1
      - name: Publish collection run summary
        if: always()
        run: |
          echo "## Rainfall collection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Finished at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Collector exit status is shown in the preceding step." >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/rainfall.json ]; then
            python -c 'import json; d=json.load(open("data/rainfall.json",encoding="utf-8")); lc=d.get("last_collection",{}); mr=d.get("missing_hours_report",{}); print("- Last saved check (Beijing): {}".format(lc.get("checked_at","unknown"))); print("- Successful cities: {}/{}".format(lc.get("success_count","?"),lc.get("expected_count",16))); print("- Missing city-hours in rolling 24h: {}/{}".format(mr.get("missing_hour_count","?"),mr.get("expected_hour_count",384)))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit rainfall history (merge-safe retry)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Keep the freshly collected working-tree JSON while moving the
            # commit base to the newest main branch.
            git reset --mixed origin/main
            git show origin/main:data/rainfall.json > /tmp/rainfall-remote.json
            python scripts/merge_rainfall.py data/rainfall.json /tmp/rainfall-remote.json
            git add data/rainfall.json
            if git diff --cached --quiet; then
              echo "No rainfall data changes to publish."
              exit 0
            fi
            git commit -m "Update rainfall observations"
            if git push origin HEAD:main; then
              echo "Rainfall history pushed successfully."
              exit 0
            fi
            echo "Push raced with another update; merging latest main and retrying ($attempt/5)."
            sleep 3
          done
          echo "::error::Could not publish rainfall data after 5 merge-safe attempts."
          exit 1
