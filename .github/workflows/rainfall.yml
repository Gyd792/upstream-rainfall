name: Rainfall collection (every 5 minutes)
on:
  schedule:
    # GitHub Actions supports scheduled workflows at 5-minute intervals.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - ".github/workflows/rainfall.yml"
permissions:
  contents: write
concurrency:
  group: rainfall-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect observed precipitation (three attempts per city)
        run: python scripts/collect.py
      - name: Commit rainfall history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/rainfall.json
          git diff --cached --quiet || git commit -m "Update rainfall observations"
          git pull --rebase origin main
          git push
