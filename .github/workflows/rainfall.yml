name: Hourly rainfall collection
on:
  schedule:
    # Every hour at minute 40 UTC (also minute 40 Beijing time).
    - cron: "40 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - ".github/workflows/rainfall.yml"
permissions:
  contents: write
concurrency:
  group: rainfall-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect observed precipitation and update rollups
        run: |
          for attempt in 1 2 3; do
            python scripts/collect.py && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Collection failed; retrying in 30 seconds (attempt $attempt/3)"
            sleep 30
          done
      - name: Commit rainfall history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/rainfall.json
          git diff --cached --quiet || git commit -m "Collect hourly observed rainfall"
          git push
