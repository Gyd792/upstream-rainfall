name: Rainfall collection (every 5 minutes)
on:
  schedule:
    # Offset away from the top of the hour to reduce GitHub schedule congestion.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - ".github/workflows/rainfall.yml"
permissions:
  contents: write
concurrency:
  group: rainfall-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect observed precipitation (three attempts per city)
        run: |
          for attempt in 1 2 3; do
            if python scripts/collect.py; then
              echo "Collection completed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Collection failed; retrying in 30 seconds ($attempt/3)."
              sleep 30
            fi
          done
          echo "::error::Collection failed after 3 workflow attempts."
          exit 1
      - name: Publish collection run summary
        if: always()
        run: |
          echo "## Rainfall collection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Finished at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Collector exit status is shown in the preceding step." >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/rainfall.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import json
d=json.load(open("data/rainfall.json",encoding="utf-8"))
lc=d.get("last_collection",{})
mr=d.get("missing_hours_report",{})
print(f"- Last saved check (Beijing): {lc.get('checked_at','unknown')}")
print(f"- Successful cities: {lc.get('success_count','?')}/{lc.get('expected_count',16)}")
print(f"- Missing city-hours in rolling 24h: {mr.get('missing_hour_count','?')}/{mr.get('expected_hour_count',384)}")
PY
          fi
      - name: Commit rainfall history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/rainfall.json
          git diff --cached --quiet || git commit -m "Update rainfall observations"
          git pull --rebase origin main
          git push
