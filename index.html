<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上游流域降雨量数据</title><style>body{font:14px Arial,sans-serif;background:#f3f6fa;color:#203247;margin:0}header{background:#15395f;color:white;padding:24px}main{padding:18px;overflow:auto}table{border-collapse:collapse;background:white;min-width:1200px;width:100%}th,td{border:1px solid #bac8d6;padding:8px;text-align:center}th{background:#e2ebf4}.note{background:#fff5df;padding:12px;margin-bottom:12px}</style></head><body><header><h1>上游流域降雨量数据</h1>云南16个地区 · 降雨量单位：mm</header><main><p class="note">早间：前一日21:00—当日07:00；晚间：当日08:00—20:00。晚间最终值按24小时总量减早间值校验。空白不代表0毫米。</p><p id="updated">正在读取数据…</p><table><thead><tr><th>日期</th><th>地区</th><th>早间雨量</th><th>晚间雨量（校验后）</th><th>24小时总量</th><th>校验状态</th></tr></thead><tbody id="rows"></tbody></table><p>说明：当前尚未接入经验证的官方实测降雨接口，因此不显示虚构数值。</p></main><script>const cities=['曲靖','陆良','宜良','石林','澄江','江川','玉溪','峨山','通海','华宁','建水','蒙自','石屏','开远','弥勒','泸西'];fetch('./data/rainfall.json').then(r=>r.json()).then(d=>{document.querySelector('#updated').textContent='数据生成时间：'+(d.updated_at||'暂无');document.querySelector('#rows').innerHTML=(d.records||[]).map(r=>{let evening=r.morning_mm!=null&&r.total_24h_mm!=null?Math.max(0,+(r.total_24h_mm-r.morning_mm).toFixed(1)):(r.evening_mm??'');return '<tr><td>'+r.date+'</td><td>'+cities[r.city_index]+'</td><td>'+(r.morning_mm??'')+'</td><td>'+evening+'</td><td>'+(r.total_24h_mm??'')+'</td><td>'+(r.validation_status||'待采集')+'</td></tr>'}).join('')}).catch(()=>document.querySelector('#updated').textContent='数据文件尚未准备好');</script></body></html>
